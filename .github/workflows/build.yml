name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - 17.0-dev

jobs:
  build:
    name: Build Kernel (beryllium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            ca-certificates \
            curl \
            flex \
            gcc \
            git \
            libssl-dev \
            lld \
            make \
            openssl \
            python-is-python3 \
            python3 \
            xz-utils \
            zip \
            libelf-dev

      - name: Download Toolchains
        run: |
          echo "Fetching AOSP Clang r487747c..."
          mkdir -p "$GITHUB_WORKSPACE/clang"
          curl -f -sSL --retry 3 "https://kali.download/nethunter-images/toolchains/clang-r487747c.tar.gz" | tar -xz -C "$GITHUB_WORKSPACE/clang"

          echo "Fetching GCC 4.9 AArch64..."
          mkdir -p "$GITHUB_WORKSPACE/gcc64"
          curl -f -sSL --retry 3 "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/pie-release-2.tar.gz" | tar -xz -C "$GITHUB_WORKSPACE/gcc64"

          echo "Fetching GCC 4.9 ARM32..."
          mkdir -p "$GITHUB_WORKSPACE/gcc32"
          curl -f -sSL --retry 3 "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/pie-release-2.tar.gz" | tar -xz -C "$GITHUB_WORKSPACE/gcc32"

          echo "Toolchains ready."

      - name: Setup KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          bash .github/scripts/patch_ksu.sh

      - name: Configure Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          mkdir -p out
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/sdm845-perf_defconfig \
            arch/arm64/configs/vendor/xiaomi/sdm845-common.config \
            arch/arm64/configs/vendor/xiaomi/beryllium.config

          ./scripts/config --file out/.config \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_KSU \
            -d CONFIG_KSU_MANUAL_HOOK \
            -d CONFIG_KSU_KPROBES_HOOK \
            -e CONFIG_KSU_SYSCALL_TABLE_HOOK \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_TMPFS \
            -e CONFIG_TMPFS_POSIX_ACL \
            -e CONFIG_TMPFS_XATTR

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            olddefconfig

          echo "=== Verifying KernelSU Configuration ==="
          grep -E "CONFIG_KSU|CONFIG_OVERLAY_FS|CONFIG_TMPFS" out/.config || true
          grep -q "CONFIG_KSU_SYSCALL_TABLE_HOOK=y" out/.config || (echo "ERROR: CONFIG_KSU_SYSCALL_TABLE_HOOK is not set!" && exit 1)
          grep -q "CONFIG_OVERLAY_FS=y" out/.config || (echo "ERROR: CONFIG_OVERLAY_FS is not set!" && exit 1)
          grep -q "CONFIG_TMPFS_XATTR=y" out/.config || (echo "ERROR: CONFIG_TMPFS_XATTR is not set!" && exit 1)

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KSU_VERSION_OVERRIDE=33355 \
            KSU_VERSION_TAG_OVERRIDE=v3.4.2 \
            KSU_MANAGER_PACKAGE=com.rifsxd.ksunext \
            Image.gz-dtb

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          cd AnyKernel3

          # Use pre-configured anykernel.sh with safe recovery checks
          cp ../anykernel.sh .

          # Pin userspace to the same release as the kernel (KSU_VERSION_TAG_OVERRIDE)
          curl -f -sSL --retry 3 -o ksud "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/ksud-aarch64-linux-android"
          curl -f -sSL --retry 3 -o busybox "https://raw.githubusercontent.com/Magisk-Modules-Repo/busybox-ndk/master/busybox-arm64"
          chmod 755 ksud busybox

          # Copy compiled kernel image
          cp ../out/arch/arm64/boot/Image.gz-dtb .

          # Create flashable zip
          zip -r9 ../AnyKernel3-beryllium-4.19.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-beryllium-4.19
          path: AnyKernel3-beryllium-4.19.zip
          if-no-files-found: error
